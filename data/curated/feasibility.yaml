# Feasibility of buying a foreign country's offer while living in the residence country.
# Three SEPARATE axes, never merged in data: legality / tos / practical. The display label is
# computed by haggler.feasibility (worst axis wins). Not legal advice.
# Seeds come from desk research on 2026-10-08 (web search summaries; official pages were not
# reachable from the research environment) -> status: unverified until re-checked.

profiles:
  se_resident_co_citizen: >-
    Vive en Suecia (residencia estable), ciudadano colombiano con cédula y tarjeta de crédito
    emitida en Colombia.

records:
  - id: netflix_co_from_se
    service_id: netflix
    target_country: CO
    residence_country: SE
    profile: se_resident_co_citizen
    steps:
      - {type: presence, value: CO, requires_presence: true}
      - {type: payment_country, value: CO}
    legality: lawful
    tos: breach_unenforced
    practical: presence_once
    reversibility: {cooldown_days: null, permanent: false, collateral: []}
    enforcement: {level: none_known}
    tos_clause:
      url: https://help.netflix.com/legal/termsofuse
      quote: "...primarily within the country in which you have established your account..."
    confidence: medium
    last_verified: 2026-10-08
    notes_es: >-
      El país se fija en el registro (ubicación al suscribirse). Usarla principalmente fuera de CO
      contradice los términos; no se conocen cancelaciones por vivir en el exterior. El catálogo
      sigue la ubicación actual.
    notes_en: >-
      The country is set at sign-up (location when subscribing). Using it mainly outside CO goes
      against the terms; no cancellations for living abroad are known. The catalog follows the
      current location.
    notes_pt: >-
      O país é definido no cadastro (localização ao assinar). Usá-la principalmente fora de CO
      contraria os termos; não se conhecem cancelamentos por morar no exterior. O catálogo segue a
      localização atual.

