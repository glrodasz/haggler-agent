  - id: icloud_plus_lt_from_se
    service_id: icloud_plus
    target_country: LT
    residence_country: SE
    profile: se_resident_co_citizen
    steps:
      - {type: store_region, value: LT}
      - {type: billing_address, value: LT, requires_false_declaration: true}
    legality: contestable_eu_right
    tos: breach_unenforced
    practical: remote
    reversibility: {collateral: [storefront_wide, balance_forfeit, family_group]}
    legal_basis:
      - {instrument: "Reglamento (UE) 2018/302", article: "Art. 4(1)(b), 4(2), 5", strength: arguable,
         tested: false}
    confidence: low
    last_verified: 2026-10-08
    notes_es: >-
      Derecho UE no probado: servicio tipo nube; el precio legal sería el neto lituano + IVA sueco.
      Apple exige dirección de facturación del país, por eso hoy implica declarar datos falsos.
    notes_en: >-
      Untested EU right: cloud-type service; the legal price would be the Lithuanian net price +
      Swedish VAT. Apple requires a billing address in that country, so today it means giving false
      information.
    notes_pt: >-
      Direito da UE não testado: serviço do tipo nuvem; o preço legal seria o líquido lituano + IVA
      sueco. A Apple exige endereço de cobrança do país, por isso hoje implica declarar dados
      falsos.

