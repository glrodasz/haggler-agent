          url: https://www.techradar.com/computing/websites-apps/youtube-is-reportedly-canceling-premium-memberships-for-people-using-vpns-to-get-discounts
          summary: Cancelaciones de membresías Premium compradas en países más baratos vía VPN.
    tos_clause:
      url: https://www.youtube.com/t/terms_paycontent
      quote: "...using the paid service predominantly outside your sign-up country..."
    confidence: medium
    last_verified: 2026-10-08
    notes_es: El país de suscripción debe coincidir con dónde vives; Google lo verifica.

