          text: Netflix Standard, HBO Max Basic med reklam, Disney+ Standard med reklam
        - fact: component
          service_id: disney_plus
          url: https://www.telia.se/mobilabonnemang/mobil-obegraensad-plus-netflix-max-disney
          text: Netflix Standard, HBO Max Basic med reklam, Disney+ Standard med reklam
    last_verified: 2026-10-11
    notes_es: >-
      Solo tiene sentido si ya pagas Obegränsad Plus (569 kr); el costo marginal de los tres
      servicios es +130 kr. El precio se revisa a mano: la lista de precios en PDF da 699 kr en
      una fila de tabla sin el nombre del plan, y la página del producto no lo muestra como texto.
