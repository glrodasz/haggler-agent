         note: "edición 18 de la lista de precios, la más nueva del índice el 2026-10-11"}
    status: unverified
    verified_by: search_summary
    watch:
      mode: manual
      pages:
        - {url: "https://www.telia.se/mobilabonnemang/mobil-obegraensad-plus-netflix-max-disney", kind: html}
        # The price list is versioned: the current edition is the newest link on the index page
        # that matches link_pattern. url is the edition we know (18, still the newest on the index
        # on 2026-10-11; its old /assets/m/... URL redirects here); the pattern must match it.
        - url: "https://www.telia.se/asset/57adaa15-db41-49d9-b13f-83a6c9beb698/TSP-4667_18_0701_Prislista-Telia-Mobil_B2C.pdf"
          kind: pdf
          index_url: "https://www.telia.se/om/priser"
          link_pattern: 'TSP-4667_(?P<edition>\d+)_\d{4}_Prislista-Telia-Mobil_B2C\.pdf'
      # Copied from probe --mode watch (2026-10-11). No price anchor: the price list prints 699 kr
      # in a table row without the plan's name, and the product page shows no amount as text.
      anchors:
        - fact: component
