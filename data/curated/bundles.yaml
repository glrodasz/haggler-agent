# Promotional bundles. Every row is unverified until the watcher confirms its anchors on our own
# fetch of an official page; the retrieval date comes from the watcher's evidence and is never
# typed here. Savings are computed from the daily price data, never typed here either.
#
# This file is the ONLY source of a bundle's values (price, base plan, components, dates,
# requirements); no job writes it. A value counts as confirmed only through the watcher's
# evidence for an anchor (a literal excerpt of our own fetch of an official page of the bundle's
# country), so a row never types a verified state: status is unverified|expired, evidence has
# no verified/retrieved_at, and verified_by says where the values come from
# (official_fetch | user_report | search_summary | agent_research).
# watch.mode: auto (the weekly watcher reads the pages) | manual (checked by hand) | off.
# Quote "off": YAML reads a bare off as false.
# Feasibility is evaluated per profile (haggler.bundles.evaluate): at home, from the requirements;
# abroad, from a curated `verdicts` record for the profile, else composed from the bundle's own
# route and its components' verdicts. A curated record can only make a verdict harder.

# Providers: the official domains of each provider PER COUNTRY (a domain also covers its
# subdomains; "host/path/" also needs the URL's path under that prefix). Every URL of a bundle
# (official_url, watch pages, anchors) must be https on its provider's domains for the bundle's
# country. automated_access: forbidden (the provider's terms forbid automated access) forces
# watch.mode off.
providers:
  - id: mercado_libre
    name: Mercado Libre
    domains:
      CO: [mercadolibre.com.co]
      MX: [mercadolibre.com.mx]
      BR: [mercadolivre.com.br]
    automated_access: allowed

  - id: telia_se
    name: Telia
    domains:
      SE: [telia.se]
    automated_access: allowed

  - id: go3
    name: Go3
    domains:
      # static3.go3.tv is the CDN host that serves the Lithuanian price-list PDF.
      LT: [go3.lt, static3.go3.tv]
    automated_access: allowed

  - id: apple
    name: Apple
    domains:
      # apple.com serves every country under a path (/se/, /co/), so the entries carry the
      # country's path prefix: a /co/ or /us/ page never confirms a Swedish bundle.
      SE: [www.apple.com/se/]
      CO: [www.apple.com/co/, one.apple.com/co/]
    automated_access: allowed

  - id: google
    name: Google
    domains:
      # gemini.google serves the plans per country under a path (/co/); support.google.com is the
      # official help centre (same pages for every country, no prices).
      CO: [gemini.google/co/, support.google.com]
    automated_access: allowed

bundles:
  - bundle_id: meli_plus_co_total
    provider_id: mercado_libre
    provider_type: marketplace
    country: CO
    name: Meli+ Total
    tier: total
    aliases: [Meli+ Total, Plan Total]
    official_url: https://www.mercadolibre.com.co/suscripciones/melimas/planes
    # The planes page (our probes of 2026-10-09 and 2026-10-11): "Precio actual con 9 por ciento
    # de descuento: 19900 pesos por mes, por 2 meses. Precio anterior: $ 21.900 pesos por mes."
    price: {amount: "21900", currency: COP, period: month, tax_included: true,
            intro_amount: "19900", intro_months: 2}
    components:
      - {service_id: disney_plus, plan_id: standard_with_ads, inclusion: included, ads: true}
      - {service_id: hbo_max, inclusion: discount_pct, value: "30"}
      - {service_id: paramount_plus, inclusion: discount_pct, value: "30"}
      - {service_id: vix, inclusion: discount_pct, value: "30"}
    requirements: {local_id: cedula, local_line: unknown, local_payment: any_card}
    evidence:
      - {url: "https://www.mercadolibre.com.co/suscripciones/melimas/planes", kind: official}
      - {url: "https://www.enter.co/empresas/meli-asi-funciona-la-nueva-suscripcion-de-mercado-libre-en-colombia-con-planes-desde-9-900-envios-gratis-y-beneficios-en-streaming/", kind: press}
    status: unverified
    verified_by: official_fetch
    watch:
      mode: manual
      pages:
        - {url: "https://www.mercadolibre.com.co/suscripciones/melimas/planes", kind: html}
      # Copied from probe --mode watch (our fetch of the planes page, 2026-10-11). The card's
      # screen-reader line states the regular price next to its intro; the benefit lines are
      # printed twice, glued.
      anchors:
        - fact: price
          url: https://www.mercadolibre.com.co/suscripciones/melimas/planes
          text: |-
            Plan Total
            $ 21.900 9% OFF
            $ 19.900/mes por 2 meses
            Precio actual con 9 por ciento de descuento: 19900 pesos por mes, por 2 meses. Precio anterior: $ 21.900 pesos por mes.
        - fact: intro
          url: https://www.mercadolibre.com.co/suscripciones/melimas/planes
          text: |-
            Plan Total
            $ 21.900 9% OFF
            $ 19.900/mes por 2 meses
            Precio actual con 9 por ciento de descuento: 19900 pesos por mes, por 2 meses. Precio anterior: $ 21.900 pesos por mes.
        - fact: component
          service_id: disney_plus
          url: https://www.mercadolibre.com.co/suscripciones/melimas/planes
          text: Disney+ Estándar con anuncios.Disney+ Estándar con anuncios.
        - fact: component
          service_id: hbo_max
          url: https://www.mercadolibre.com.co/suscripciones/melimas/planes
          text: 30% OFF en HBO Max, Universal+, Paramount+ y ViX Premium.30% OFF en HBO Max, Universal+, Paramount+ y ViX Premium.
        - fact: component
          service_id: paramount_plus
          url: https://www.mercadolibre.com.co/suscripciones/melimas/planes
          text: 30% OFF en HBO Max, Universal+, Paramount+ y ViX Premium.30% OFF en HBO Max, Universal+, Paramount+ y ViX Premium.
        - fact: component
          service_id: vix
          url: https://www.mercadolibre.com.co/suscripciones/melimas/planes
          text: 30% OFF en HBO Max, Universal+, Paramount+ y ViX Premium.30% OFF en HBO Max, Universal+, Paramount+ y ViX Premium.
    # User decision 2 (phase 3): own use from Sweden with a Colombian card. The rank comes from
    # the axes (haggler.feasibility.axes_rank: 2) and never ends below the worst component's;
    # without a verified tos_clause it is shown as unverified/low.
    verdicts:
      - profile: se_resident_co_citizen
        legality: lawful
        tos: breach_unenforced
        practical: remote
        steps:
          - {type: payment_country, value: CO}
        status: unverified
        confidence: low
        last_verified: 2026-10-08
        notes_es: según uso propio; sin cita de los términos
    last_verified: 2026-10-11
    notes_es: >-
      Precio regular 21.900 COP/mes; los 2 primeros meses, 19.900. El usuario lo usa desde Suecia
      con tarjeta colombiana. HBO Max, Paramount+ y ViX aparecen como 30 % de descuento, no
      incluidos.

