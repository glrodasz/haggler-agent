# Promotional bundles. Every row is unverified until the watcher confirms its anchors on our own
# fetch of an official page; the retrieval date comes from the watcher's evidence and is never
# typed here. Savings are computed from the daily price data, never typed here either.
#
# This file is the ONLY source of a bundle's values (price, base plan, components, dates,
# requirements); no job writes it. A value counts as confirmed only through the watcher's
# evidence for an anchor (a literal excerpt of our own fetch of an official page of the bundle's
# country), so a row never types a verified state: status is unverified|expired, evidence has
# no verified/retrieved_at, and verified_by says where the values come from
# (official_fetch | user_report | search_summary | agent_research).
# watch.mode: auto (the weekly watcher reads the pages) | manual (checked by hand) | off.
# Quote "off": YAML reads a bare off as false.
# Feasibility is evaluated per profile (haggler.bundles.evaluate): at home, from the requirements;
# abroad, from a curated `verdicts` record for the profile, else composed from the bundle's own
# route and its components' verdicts. A curated record can only make a verdict harder.

# Providers: the official domains of each provider PER COUNTRY (a domain also covers its
# subdomains; "host/path/" also needs the URL's path under that prefix). Every URL of a bundle
# (official_url, watch pages, anchors) must be https on its provider's domains for the bundle's
# country. automated_access: forbidden (the provider's terms forbid automated access) forces
# watch.mode off.
providers:
  - id: mercado_libre
    name: Mercado Libre
    domains:
      CO: [mercadolibre.com.co]
      MX: [mercadolibre.com.mx]
      BR: [mercadolivre.com.br]
      CL: [mercadolibre.cl]
    automated_access: allowed

  - id: telia_se
    name: Telia
    domains:
      SE: [telia.se]
    automated_access: allowed

  - id: go3
    name: Go3
    domains:
      # static3.go3.tv is the CDN host that serves the Lithuanian price-list PDF.
      LT: [go3.lt, static3.go3.tv]
    automated_access: allowed

  - id: apple
    name: Apple
    domains:
      # apple.com serves every country under a path (/se/, /co/), so the entries carry the
      # country's path prefix: a /co/ or /us/ page never confirms a Swedish bundle.
      SE: [www.apple.com/se/]
      CO: [www.apple.com/co/, one.apple.com/co/]
      AT: [www.apple.com/at/]
      BE: [www.apple.com/befr/]
      BR: [www.apple.com/br/]
      CA: [www.apple.com/ca/]
      CH: [www.apple.com/chde/]
      CL: [www.apple.com/cl/]
      CZ: [www.apple.com/cz/]
      DE: [www.apple.com/de/]
      DK: [www.apple.com/dk/]
      ES: [www.apple.com/es/]
      FI: [www.apple.com/fi/]
      FR: [www.apple.com/fr/]
      GB: [www.apple.com/uk/]
      HU: [www.apple.com/hu/]
      ID: [www.apple.com/id/]
      IE: [www.apple.com/ie/]
      IT: [www.apple.com/it/]
      LU: [www.apple.com/lu/]
      MX: [www.apple.com/mx/]
      NL: [www.apple.com/nl/]
      "NO": [www.apple.com/no/]
      PH: [www.apple.com/ph/]
      PL: [www.apple.com/pl/]
      PT: [www.apple.com/pt/]
      US: [www.apple.com/apple-one/]
      VN: [www.apple.com/vn/]
    automated_access: allowed

  - id: google
    name: Google
    domains:
      # gemini.google serves the plans per country under a path (/co/); support.google.com is the
