  - bundle_id: telia_se_obegransad_streaming
    provider_id: telia_se
    provider_type: telco_mobile
    country: SE
    name: Telia Obegränsad Plus + Netflix, HBO Max y Disney+
    tier: obegransad_plus_all_streaming
    # Product title as the page prints it (H0 probe, 2026-10-09).
    aliases: [Obegränsad Plus med Netflix, HBO Max och Disney+]
    # /privat/mobilt/abonnemang gives 404 since 2026-10-09 (H0 probe); it redirected here.
    official_url: https://www.telia.se/mobilabonnemang/mobil-obegraensad-plus-netflix-max-disney
    price:
      amount: "699"
      currency: SEK
      period: month
      tax_included: true
      # Sold on top of Obegränsad Plus: marginal_amount = amount - base_plan_amount.
      base_plan_name: Telia Obegränsad Plus
      base_plan_amount: "569"
      marginal_amount: "130"
    components:
      - {service_id: netflix, plan_id: standard, inclusion: included}
      - {service_id: hbo_max, plan_id: basic_with_ads, inclusion: included, ads: true}
      - {service_id: disney_plus, plan_id: standard_with_ads, inclusion: included, ads: true}
    requirements: {local_id: personnummer, local_line: mobile, local_payment: local_bank, credit_check: true}
    evidence:
      - {url: "https://www.telia.se/assets/m/3bb36ae829ef848f/original/TSP-4667_18_0701_Prislista-Telia-Mobil_B2C.pdf", kind: official,
         note: "edición 18 de la lista de precios; da 404 desde 2026-10-09 (reemplazada)"}
    status: unverified
    verified_by: search_summary
    watch:
      mode: manual
      pages:
        - {url: "https://www.telia.se/mobilabonnemang/mobil-obegraensad-plus-netflix-max-disney", kind: html}
        # The price list is versioned: the current edition is the newest link on the index page
        # that matches link_pattern. url is the last edition we know (18, superseded: 404 since
        # 2026-10-09); the pattern must match it.
        - url: "https://www.telia.se/assets/m/3bb36ae829ef848f/original/TSP-4667_18_0701_Prislista-Telia-Mobil_B2C.pdf"
          kind: pdf
          index_url: "https://www.telia.se/om/priser"
          link_pattern: 'TSP-4667_(?P<edition>\d+)_\d{4}_Prislista-Telia-Mobil_B2C\.pdf'
    last_verified: 2026-10-08
    notes_es: >-
      Solo tiene sentido si ya pagas Obegränsad Plus (569 kr); el costo marginal de los tres
      servicios es +130 kr. Fecha de vigencia de la lista de precios sin confirmar.

