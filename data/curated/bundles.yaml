# Promotional bundles. Every row is unverified until an official page is re-fetched with a
# retrieval date. Savings are computed from the daily price data, never typed here.

bundles:
  - bundle_id: meli_plus_co_total
    provider_id: mercado_libre
    provider_type: marketplace
    country: CO
    name: Meli+ Total
    tier: total
    official_url: https://www.mercadolibre.com.co/suscripciones/melimas/planes
    price: {amount: "24900", currency: COP, period: month, tax_included: true}
    components:
      - {service_id: disney_plus, plan_id: standard_with_ads, inclusion: included, ads: true}
      - {service_id: hbo_max, inclusion: discount_pct, value: "30"}
      - {service_id: paramount_plus, inclusion: discount_pct, value: "30"}
      - {service_id: vix, inclusion: discount_pct, value: "30"}
    requirements: {local_id: cedula, local_line: unknown, local_payment: any_card}
    feasibility_from:
      SE: {purchasable_remotely: "yes", usable_abroad: "yes", tos_risk: medium, evidence: user_report}
    evidence:
      - {url: "https://www.mercadolibre.com.co/suscripciones/melimas/planes", kind: official}
      - {url: "https://www.enter.co/empresas/meli-asi-funciona-la-nueva-suscripcion-de-mercado-libre-en-colombia-con-planes-desde-9-900-envios-gratis-y-beneficios-en-streaming/", kind: press}
    status: unverified
    last_verified: 2026-10-08
    notes_es: >-
      Fuentes en conflicto sobre el precio (COP 24.900 vs 21.900). El usuario lo usa desde Suecia
      con tarjeta colombiana. HBO Max aparece como 30 % de descuento, no incluido.

