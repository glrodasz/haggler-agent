# TEMPORARY: prints real-page snippets for adapter tuning. Remove after use.
name: debug-dump
on:
  push:
    branches: ["claude/**"]
    paths: ["probe/debug_dump.py", ".github/workflows/debug-dump.yml"]
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run python probe/debug_dump.py
