# Runs the daily prices Cloud Run Job (haggler-daily, normally 04:17 Europe/Stockholm from Cloud
# Scheduler) on demand, waits for it and publishes the site. Useful right after a catalog change
# (new services or countries) so its prices show up without waiting for the next morning.
# Same repository variables and Workload Identity Federation as deploy-job and research
# (docs/SETUP.md); haggler-github already holds roles/run.developer, which may execute jobs.
name: daily

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the site when the job finishes"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC token for Workload Identity Federation
  actions: write # to start publish.yml

concurrency:
  group: daily
  cancel-in-progress: false

env:
  JOB_NAME: ${{ vars.GCP_JOB_NAME || 'haggler-daily' }}
  REGION: ${{ vars.GCP_REGION }}

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check repository variables
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_GITHUB_SA: ${{ vars.GCP_GITHUB_SA }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error title=daily::Lánzalo desde ${DEFAULT_BRANCH}: Workload Identity Federation solo acepta esa rama."
            exit 1
          fi
          missing=""
          for name in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_GITHUB_SA; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=daily::Faltan variables de repositorio:${missing}. Ver docs/SETUP.md."
            exit 1
          fi

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_GITHUB_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Execute the daily prices job
        run: |
          gcloud run jobs execute "${JOB_NAME}" --region "${REGION}" --wait
          {
            echo "### Precios diarios ejecutados"
            echo ""
            echo "- Job: \`${JOB_NAME}\` (${REGION})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the site
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
