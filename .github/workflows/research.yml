# Runs the feasibility research Cloud Run Job (haggler-research, normally Mondays from Cloud
# Scheduler) on demand, waits for it and publishes the site so the new findings show up. The
# per-run caps can be raised for this run only: each subject costs Gemini calls and search
# queries, and the job's monthly guard (HAGGLER_RESEARCH_MAX_MONTH_QUERIES) still applies.
# Same repository variables and Workload Identity Federation as deploy-job (docs/SETUP.md §13);
# haggler-github already holds roles/run.developer, which may execute jobs with overrides.
name: research

on:
  workflow_dispatch:
    inputs:
      max_pairs:
        description: "Pairs (service × country) to research in this run (job default: 6)"
        required: false
        default: ""
      max_services:
        description: "Services to research in this run (job default: 3)"
        required: false
        default: ""
      publish:
        description: "Publish the site when the job finishes"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # OIDC token for Workload Identity Federation
  actions: write # to start publish.yml

concurrency:
  group: research
  cancel-in-progress: false

env:
  RESEARCH_JOB_NAME: ${{ vars.GCP_RESEARCH_JOB_NAME || 'haggler-research' }}
  REGION: ${{ vars.GCP_REGION }}

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check repository variables and inputs
        id: cfg
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_GITHUB_SA: ${{ vars.GCP_GITHUB_SA }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MAX_PAIRS: ${{ inputs.max_pairs }}
          MAX_SERVICES: ${{ inputs.max_services }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error title=research::Lánzalo desde ${DEFAULT_BRANCH}: Workload Identity Federation solo acepta esa rama."
            exit 1
          fi
          missing=""
          for name in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_GITHUB_SA; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=research::Faltan variables de repositorio:${missing}. Ver docs/SETUP.md."
            exit 1
          fi
          overrides=""
          for pair in "HAGGLER_RESEARCH_MAX_PAIRS=${MAX_PAIRS}" "HAGGLER_RESEARCH_MAX_SERVICES=${MAX_SERVICES}"; do
            value="${pair#*=}"
            [ -n "$value" ] || continue
            case "$value" in
              *[!0-9]*)
                echo "::error title=research::${pair%%=*} debe ser un número entero, no «${value}»."
                exit 1
                ;;
            esac
            overrides="${overrides:+${overrides},}${pair}"
          done
          echo "overrides=${overrides}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_GITHUB_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Execute the research job
        env:
          OVERRIDES: ${{ steps.cfg.outputs.overrides }}
        run: |
          args=(run jobs execute "${RESEARCH_JOB_NAME}" --region "${REGION}" --wait)
          if [ -n "${OVERRIDES}" ]; then
            args+=(--update-env-vars "${OVERRIDES}")
          fi
          gcloud "${args[@]}"
          {
            echo "### Investigación ejecutada"
            echo ""
            echo "- Job: \`${RESEARCH_JOB_NAME}\` (${REGION})"
            echo "- Límites de esta corrida: ${OVERRIDES:-los del job}"
            echo "- Los hallazgos nuevos quedan *Pendiente de revisión*: \`uv run haggler research review\` (docs/SETUP.md §13)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the site
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
