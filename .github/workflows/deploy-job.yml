# Builds the job image, pushes it to Artifact Registry and (re)deploys both Cloud Run Jobs: the
# daily prices job and the weekly research job (feasibility research and the bundle watcher;
# same image, other arguments). A change to data/curated/** (bundles.yaml) redeploys both.
# Needs the repository variables printed by infra/bootstrap.sh (docs/SETUP.md); without them the
# workflow only emits a notice. Workload Identity Federation only trusts the default branch, so a
# manual run from another branch is skipped with a notice too.
name: deploy-job

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "catalog/**"
      - "agents/**"
      - "data/curated/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/deploy-job.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for Workload Identity Federation

concurrency:
  group: deploy-job
  cancel-in-progress: false

env:
  # bootstrap.sh prints GCP_JOB_NAME when JOB was overridden; it must name the scheduled job.
  JOB_NAME: ${{ vars.GCP_JOB_NAME || 'haggler-daily' }}
  RESEARCH_JOB_NAME: ${{ vars.GCP_RESEARCH_JOB_NAME || 'haggler-research' }}
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
  JOB_SA: ${{ vars.GCP_JOB_SA }}
  GCS_BUCKET: ${{ vars.GCS_BUCKET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check repository variables
        id: cfg
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_GITHUB_SA: ${{ vars.GCP_GITHUB_SA }}
          GCP_JOB_SA: ${{ vars.GCP_JOB_SA }}
          GCS_BUCKET: ${{ vars.GCS_BUCKET }}
          AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::notice title=deploy-job omitido::${GITHUB_REF} no es la rama por defecto; Workload Identity Federation solo la acepta a ella. Ver docs/SETUP.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          for name in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_GITHUB_SA GCP_JOB_SA \
                      GCS_BUCKET AR_REPOSITORY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::notice title=deploy-job omitido::Faltan variables de repositorio:${missing}. Ver docs/SETUP.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.cfg.outputs.ok == 'true'

      - name: Authenticate to Google Cloud (WIF)
        if: steps.cfg.outputs.ok == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_GITHUB_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v3
        if: steps.cfg.outputs.ok == 'true'

      - name: Build and push image
        if: steps.cfg.outputs.ok == 'true'
        id: image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          image="${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPOSITORY}/haggler"
          docker build --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${image}:${GITHUB_SHA}" --tag "${image}:latest" .
          docker push "${image}:${GITHUB_SHA}"
          docker push "${image}:latest"
          echo "ref=${image}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Deploy Cloud Run Job
        if: steps.cfg.outputs.ok == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          # Optional repository variable. --set-env-vars replaces every variable on each deploy,
          # so settings changed by hand with "gcloud run jobs update" would not survive.
          EXTRACT_MODEL: ${{ vars.HAGGLER_EXTRACT_MODEL }}
        run: |
          env_vars="HAGGLER_STORE=gcs,HAGGLER_GCS_BUCKET=${GCS_BUCKET},GOOGLE_GENAI_USE_ENTERPRISE=1"
          env_vars="${env_vars},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global"
          if [ -n "${EXTRACT_MODEL}" ]; then
            env_vars="${env_vars},HAGGLER_EXTRACT_MODEL=${EXTRACT_MODEL}"
          fi
          # --max-retries 1 only re-runs a task that crashed: "haggler daily" exits 0 once it has
          # persisted latest/ (a low success ratio is reported in run.json/coverage.json, not by
          # the exit code), so a bad day is never re-validated against its own output.
          gcloud run jobs deploy "${JOB_NAME}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --service-account "${JOB_SA}" \
            --cpu 1 \
            --memory 1Gi \
            --task-timeout 75m \
            --max-retries 1 \
            --set-env-vars "${env_vars}" \
            --labels "managed-by=github-actions,commit=${GITHUB_SHA::12}" \
            --quiet
          {
            echo "### Cloud Run Job desplegado"
            echo ""
            echo "- Job: \`${JOB_NAME}\` (${REGION})"
            echo "- Imagen: \`${IMAGE}\`"
            echo "- Ejecutar ahora: \`gcloud run jobs execute ${JOB_NAME} --region ${REGION} --wait\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy research Cloud Run Job
        if: steps.cfg.outputs.ok == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          # Optional repository variables (defaults in src/haggler/config.py).
          RESEARCH_MODEL: ${{ vars.HAGGLER_RESEARCH_MODEL }}
          RESEARCH_MAX_BUNDLES: ${{ vars.HAGGLER_RESEARCH_MAX_BUNDLES }}
          BUNDLE_WATCH_MAX_PAGES: ${{ vars.HAGGLER_BUNDLE_WATCH_MAX_PAGES }}
        run: |
          env_vars="HAGGLER_STORE=gcs,HAGGLER_GCS_BUCKET=${GCS_BUCKET},GOOGLE_GENAI_USE_ENTERPRISE=1"
          env_vars="${env_vars},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GOOGLE_CLOUD_LOCATION=global"
          if [ -n "${RESEARCH_MODEL}" ]; then
            env_vars="${env_vars},HAGGLER_RESEARCH_MODEL=${RESEARCH_MODEL}"
          fi
          # Bundles (docs/SETUP.md §14): whole numbers only. Anything else would make the job
          # fail at start (or, with a comma, set another variable), so it is skipped with a
          # warning and the job keeps the default.
          add_count() {
            [ -n "$2" ] || return 0
            case "$2" in
              *[!0-9]*)
                echo "::warning title=deploy-job::$1 no es un número entero; el job usa el valor por defecto (src/haggler/config.py)."
                return 0
                ;;
            esac
            env_vars="${env_vars},$1=$2"
          }
          add_count HAGGLER_RESEARCH_MAX_BUNDLES "${RESEARCH_MAX_BUNDLES}"
          add_count HAGGLER_BUNDLE_WATCH_MAX_PAGES "${BUNDLE_WATCH_MAX_PAGES}"
          # --max-retries 0: a retry would spend the run's search-query budget again; the next
          # weekly run picks up what this one could not do (failed subjects keep their facts).
          gcloud run jobs deploy "${RESEARCH_JOB_NAME}" \
            --image "${IMAGE}" \
            --region "${REGION}" \
            --service-account "${JOB_SA}" \
            --args=research,run,--store,gcs \
            --cpu 1 \
            --memory 1Gi \
            --task-timeout 30m \
            --max-retries 0 \
            --set-env-vars "${env_vars}" \
            --labels "managed-by=github-actions,commit=${GITHUB_SHA::12}" \
            --quiet
          {
            echo ""
            echo "- Job de investigación: \`${RESEARCH_JOB_NAME}\` (semanal)"
            echo "- Ejecutar ahora: \`gcloud run jobs execute ${RESEARCH_JOB_NAME} --region ${REGION} --wait\`"
            echo "- Solo el vigilante de paquetes (0 consultas): \`gcloud run jobs execute ${RESEARCH_JOB_NAME} --region ${REGION} --args=research,run,--store,gcs,--watch-only --wait\`"
          } >> "$GITHUB_STEP_SUMMARY"
