<title>Haggler containers: what runs where (C4 level 2)</title>
<desc>Cloud Scheduler triggers two Cloud Run jobs that fetch public vendor pages, call Gemini only as a fallback, and write snapshots to a GCS bucket. GitHub Actions reads the bucket, opens data-sync PRs to the repository and deploys a static site to GitHub Pages, where verdicts run in the visitor's browser.</desc>
