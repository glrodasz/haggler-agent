<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 652" width="880" role="img">
<title>Haggler weekly research: from a hunch to a verdict</title>
<desc>The weekly research job plans worthwhile pairs, watches bundle anchors without an LLM, lets research agents propose facts with Gemini and Google Search, keeps only facts whose quote its own fetch finds, and stores them as pending review. In the repository a maintainer accepts findings, a pure evaluator derives verdicts and profile_rules.py exports decision trees that verdicts.ts walks in the visitor's browser.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker>
<marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk e-coral" d="M2 1L8 5L2 9"/></marker>
</defs>

<g class="ct-purple">
<rect x="30" y="30" width="610" height="246" rx="16"/>
<text class="th" x="52" y="56" dominant-baseline="central">Weekly research</text>
<text class="ts" x="52" y="75" dominant-baseline="central">Cloud Run job · Mondays</text>
</g>
<g class="n-purple"><rect x="50" y="100" width="170" height="56" rx="8"/>
<text class="tm" x="135" y="119" text-anchor="middle" dominant-baseline="central">plan_research</text>
<text class="ts" x="135" y="138" text-anchor="middle" dominant-baseline="central">saves ≥1 €/mo and 15%</text></g>
<g class="n-purple"><rect x="245" y="100" width="170" height="56" rx="8"/>
<text class="tm" x="330" y="119" text-anchor="middle" dominant-baseline="central">watch_bundles</text>
<text class="ts" x="330" y="138" text-anchor="middle" dominant-baseline="central">anchors, no LLM</text></g>
<g class="n-purple"><rect x="440" y="100" width="170" height="56" rx="8"/>
<text class="th" x="525" y="119" text-anchor="middle" dominant-baseline="central">Research agents</text>
<text class="ts" x="525" y="138" text-anchor="middle" dominant-baseline="central">service, pair, bundle</text></g>
<g class="n-purple"><rect x="50" y="200" width="170" height="56" rx="8"/>
<text class="tm" x="135" y="219" text-anchor="middle" dominant-baseline="central">verify_evidence</text>
<text class="ts" x="135" y="238" text-anchor="middle" dominant-baseline="central">our fetch finds the quote</text></g>
<g class="n-purple"><rect x="245" y="200" width="170" height="56" rx="8"/>
<text class="tm" x="330" y="219" text-anchor="middle" dominant-baseline="central">persist</text>
<text class="ts" x="330" y="238" text-anchor="middle" dominant-baseline="central">pending review</text></g>
<path class="arr" d="M220 128 H243" marker-end="url(#a)"/>
<path class="arr" d="M415 128 H438" marker-end="url(#a)"/>
<path class="arr" d="M525 156 V178 H135 V198" marker-end="url(#a)"/>
<path class="arr" d="M220 228 H243" marker-end="url(#a)"/>

<g class="s-coral dash"><rect x="680" y="100" width="170" height="56" rx="8"/>
<text class="th" x="765" y="119" text-anchor="middle" dominant-baseline="central">Gemini</text>
<text class="ts" x="765" y="138" text-anchor="middle" dominant-baseline="central">+ Google Search</text></g>
<path class="arr llm e-coral" d="M610 128 H678" marker-end="url(#al)"/>
<g class="s-gray"><rect x="680" y="200" width="170" height="56" rx="8"/>
<text class="th" x="765" y="219" text-anchor="middle" dominant-baseline="central">GCS bucket</text>
<text class="ts" x="765" y="238" text-anchor="middle" dominant-baseline="central">research/latest/</text></g>
<path class="arr" d="M415 228 H678" marker-end="url(#a)"/>

<g class="ct-teal">
<rect x="30" y="320" width="820" height="136" rx="16"/>
<text class="th" x="52" y="346" dominant-baseline="central">Repository</text>
<text class="ts" x="52" y="365" dominant-baseline="central">reviewed in PRs</text>
</g>
<g class="n-teal"><rect x="50" y="380" width="165" height="56" rx="8"/>
<text class="tm" x="132" y="399" text-anchor="middle" dominant-baseline="central">haggler sync</text>
<text class="ts" x="132" y="418" text-anchor="middle" dominant-baseline="central">data/research/</text></g>
<g class="n-gray"><rect x="255" y="380" width="165" height="56" rx="8"/>
<text class="th" x="337" y="399" text-anchor="middle" dominant-baseline="central">Maintainer review</text>
<text class="ts" x="337" y="418" text-anchor="middle" dominant-baseline="central">accept by evidence hash</text></g>
<g class="n-teal"><rect x="460" y="380" width="165" height="56" rx="8"/>
<text class="tm" x="542" y="399" text-anchor="middle" dominant-baseline="central">evaluate.py</text>
<text class="ts" x="542" y="418" text-anchor="middle" dominant-baseline="central">pure, curated data wins</text></g>
<g class="n-teal"><rect x="665" y="380" width="165" height="56" rx="8"/>
<text class="tm" x="747" y="399" text-anchor="middle" dominant-baseline="central">profile_rules.py</text>
<text class="ts" x="747" y="418" text-anchor="middle" dominant-baseline="central">decision tree per pair</text></g>
<path class="arr" d="M765 256 V298 H195 V378" marker-end="url(#a)"/>
<path class="arr" d="M215 408 H253" marker-end="url(#a)"/>
<path class="arr" d="M420 408 H458" marker-end="url(#a)"/>
<path class="arr" d="M625 408 H663" marker-end="url(#a)"/>

<g class="ct-gray">
<rect x="30" y="496" width="820" height="136" rx="16"/>
<text class="th" x="52" y="522" dominant-baseline="central">Visitor's browser</text>
<text class="ts" x="52" y="541" dominant-baseline="central">no server, no account</text>
</g>
<g class="n-gray"><rect x="460" y="556" width="165" height="56" rx="8"/>
<text class="th" x="542" y="575" text-anchor="middle" dominant-baseline="central">Visitor profile</text>
<text class="ts" x="542" y="594" text-anchor="middle" dominant-baseline="central">residence + ties</text></g>
<g class="n-gray"><rect x="665" y="556" width="165" height="56" rx="8"/>
<text class="tm" x="747" y="575" text-anchor="middle" dominant-baseline="central">verdicts.ts</text>
<text class="ts" x="747" y="594" text-anchor="middle" dominant-baseline="central">legal · ToS · practical</text></g>
<path class="arr" d="M747 436 V554" marker-end="url(#a)"/>
<path class="arr" d="M625 584 H663" marker-end="url(#a)"/>

</svg>
