<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 576" width="880" role="img">
<title>Haggler daily run: from vendor page to published price</title>
<desc>The daily Cloud Run job plans one task per source, fetches and parses pages in parallel, calls Gemini only when a parser fails, normalizes currencies, validates and quarantines large jumps, gets a second opinion, and persists to GCS. The publish workflow verifies the snapshot, builds site data and deploys the static site to GitHub Pages.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker>
<marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk e-coral" d="M2 1L8 5L2 9"/></marker>
</defs>

<g class="ct-purple">
<rect x="30" y="30" width="610" height="346" rx="16"/>
<text class="th" x="52" y="56" dominant-baseline="central">Daily price run</text>
<text class="ts" x="52" y="75" dominant-baseline="central">Cloud Run job · 04:17 Europe/Stockholm</text>
</g>
<g class="n-purple"><rect x="50" y="100" width="170" height="56" rx="8"/>
<text class="tm" x="135" y="119" text-anchor="middle" dominant-baseline="central">plan_tasks</text>
<text class="ts" x="135" y="138" text-anchor="middle" dominant-baseline="central">one task per source</text></g>
<g class="n-purple"><rect x="245" y="100" width="170" height="56" rx="8"/>
<text class="tm" x="330" y="119" text-anchor="middle" dominant-baseline="central">fetch_and_parse</text>
<text class="ts" x="330" y="138" text-anchor="middle" dominant-baseline="central">parallel, parsers only</text></g>
<g class="n-purple"><rect x="440" y="100" width="170" height="56" rx="8"/>
<text class="tm" x="525" y="119" text-anchor="middle" dominant-baseline="central">llm_extract</text>
<text class="ts" x="525" y="138" text-anchor="middle" dominant-baseline="central">only if a parser fails</text></g>
<g class="n-purple"><rect x="50" y="200" width="170" height="56" rx="8"/>
<text class="tm" x="135" y="219" text-anchor="middle" dominant-baseline="central">fx_normalize</text>
<text class="ts" x="135" y="238" text-anchor="middle" dominant-baseline="central">monthly price, VAT flag</text></g>
<g class="n-purple"><rect x="245" y="200" width="170" height="56" rx="8"/>
<text class="tm" x="330" y="219" text-anchor="middle" dominant-baseline="central">validate</text>
<text class="ts" x="330" y="238" text-anchor="middle" dominant-baseline="central">quarantines &gt;30% jumps</text></g>
<g class="n-purple"><rect x="440" y="200" width="170" height="56" rx="8"/>
<text class="tm" x="525" y="219" text-anchor="middle" dominant-baseline="central">adjudicate</text>
<text class="ts" x="525" y="238" text-anchor="middle" dominant-baseline="central">second opinion</text></g>
<g class="n-purple"><rect x="440" y="300" width="170" height="56" rx="8"/>
<text class="tm" x="525" y="319" text-anchor="middle" dominant-baseline="central">persist</text>
<text class="ts" x="525" y="338" text-anchor="middle" dominant-baseline="central">runs/ + latest/</text></g>

<path class="arr" d="M220 128 H243" marker-end="url(#a)"/>
<path class="arr" d="M415 128 H438" marker-end="url(#a)"/>
<path class="arr" d="M525 156 V178 H135 V198" marker-end="url(#a)"/>
<path class="arr" d="M220 228 H243" marker-end="url(#a)"/>
<path class="arr" d="M415 228 H438" marker-end="url(#a)"/>
<path class="arr" d="M525 256 V298" marker-end="url(#a)"/>

<g class="s-coral dash"><rect x="680" y="150" width="170" height="56" rx="8"/>
<text class="th" x="765" y="169" text-anchor="middle" dominant-baseline="central">Gemini</text>
<text class="ts" x="765" y="188" text-anchor="middle" dominant-baseline="central">returns quotes only</text></g>
<path class="arr llm e-coral" d="M610 128 H645 V165 H678" marker-end="url(#al)"/>
<path class="arr llm e-coral" d="M610 228 H645 V191 H678" marker-end="url(#al)"/>

<g class="s-gray"><rect x="680" y="300" width="170" height="56" rx="8"/>
<text class="th" x="765" y="319" text-anchor="middle" dominant-baseline="central">GCS latest/</text>
<text class="ts" x="765" y="338" text-anchor="middle" dominant-baseline="central">the only handoff</text></g>
<path class="arr" d="M610 328 H678" marker-end="url(#a)"/>

<g class="ct-teal">
<rect x="30" y="420" width="820" height="136" rx="16"/>
<text class="th" x="52" y="446" dominant-baseline="central">Publish</text>
<text class="ts" x="52" y="465" dominant-baseline="central">GitHub Actions</text>
</g>
<g class="n-teal"><rect x="50" y="480" width="165" height="56" rx="8"/>
<text class="tm" x="132" y="499" text-anchor="middle" dominant-baseline="central">haggler sync</text>
<text class="ts" x="132" y="518" text-anchor="middle" dominant-baseline="central">verify sha256, open PR</text></g>
<g class="n-teal"><rect x="255" y="480" width="165" height="56" rx="8"/>
<text class="tm" x="337" y="499" text-anchor="middle" dominant-baseline="central">site-data</text>
<text class="ts" x="337" y="518" text-anchor="middle" dominant-baseline="central">offers + rule trees</text></g>
<g class="n-teal"><rect x="460" y="480" width="165" height="56" rx="8"/>
<text class="tm" x="542" y="499" text-anchor="middle" dominant-baseline="central">astro build</text>
<text class="ts" x="542" y="518" text-anchor="middle" dominant-baseline="central">static site</text></g>
<g class="n-teal"><rect x="665" y="480" width="165" height="56" rx="8"/>
<text class="th" x="747" y="499" text-anchor="middle" dominant-baseline="central">Pages deploy</text>
<text class="ts" x="747" y="518" text-anchor="middle" dominant-baseline="central">public site</text></g>
<path class="arr" d="M765 356 V398 H195 V478" marker-end="url(#a)"/>
<path class="arr" d="M215 508 H253" marker-end="url(#a)"/>
<path class="arr" d="M420 508 H458" marker-end="url(#a)"/>
<path class="arr" d="M625 508 H663" marker-end="url(#a)"/>

</svg>
