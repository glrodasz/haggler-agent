<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 446" width="880" role="img">
<title>Haggler system context (C4 level 1)</title>
<desc>Visitors use Haggler to compare subscription offers and see savings by risk; a maintainer curates the catalog and accepts findings. Haggler fetches official prices from subscription vendors and the App Store, daily rates from FX sources, and asks Gemini with Google Search to propose quoted facts.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M2 1L8 5L2 9"/></marker>
<marker id="al" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk e-coral" d="M2 1L8 5L2 9"/></marker>
</defs>

<g class="s-gray">
<rect x="120" y="30" width="240" height="64" rx="32"/>
<text class="th" x="240" y="52" text-anchor="middle" dominant-baseline="central">Visitor</text>
<text class="ts" x="240" y="72" text-anchor="middle" dominant-baseline="central">compares subscription offers</text>
</g>
<g class="s-gray">
<rect x="520" y="30" width="240" height="64" rx="32"/>
<text class="th" x="640" y="52" text-anchor="middle" dominant-baseline="central">Maintainer</text>
<text class="ts" x="640" y="72" text-anchor="middle" dominant-baseline="central">curates catalog, reviews facts</text>
</g>

<g class="s-purple">
<rect x="240" y="190" width="400" height="90" rx="10"/>
<text class="th" x="440" y="214" text-anchor="middle" dominant-baseline="central">Haggler</text>
<text class="ts" x="440" y="240" text-anchor="middle" dominant-baseline="central">tracks prices in 67 countries,</text>
<text class="ts" x="440" y="258" text-anchor="middle" dominant-baseline="central">verifies offers, derives verdicts</text>
</g>

<path class="arr" d="M300 94 V188" marker-end="url(#a)"/>
<text class="ts" x="290" y="141" text-anchor="end" dominant-baseline="central">sees savings by risk</text>
<path class="arr" d="M580 94 V188" marker-end="url(#a)"/>
<text class="ts" x="590" y="141" dominant-baseline="central">accepts findings in PRs</text>

<g class="s-gray">
<rect x="30" y="360" width="250" height="64" rx="10"/>
<text class="th" x="155" y="382" text-anchor="middle" dominant-baseline="central">Subscription vendors</text>
<text class="ts" x="155" y="402" text-anchor="middle" dominant-baseline="central">official pages, App Store</text>
</g>
<g class="s-gray">
<rect x="315" y="360" width="250" height="64" rx="10"/>
<text class="th" x="440" y="382" text-anchor="middle" dominant-baseline="central">FX rate sources</text>
<text class="ts" x="440" y="402" text-anchor="middle" dominant-baseline="central">ECB via Frankfurter, BanRep, BCRA</text>
</g>
<g class="s-coral dash">
<rect x="600" y="360" width="250" height="64" rx="10"/>
<text class="th" x="725" y="382" text-anchor="middle" dominant-baseline="central">Gemini on Vertex AI</text>
<text class="ts" x="725" y="402" text-anchor="middle" dominant-baseline="central">+ Google Search grounding</text>
</g>

<path class="arr" d="M300 280 V322 H155 V358" marker-end="url(#a)"/>
<text class="ts" x="164" y="310" dominant-baseline="central">fetches prices daily</text>
<path class="arr" d="M440 280 V358" marker-end="url(#a)"/>
<text class="ts" x="450" y="320" dominant-baseline="central">daily rates</text>
<path class="arr llm e-coral" d="M580 280 V322 H725 V358" marker-end="url(#al)"/>
<text class="ts" x="716" y="310" text-anchor="end" dominant-baseline="central">proposes quoted facts</text>
</svg>
