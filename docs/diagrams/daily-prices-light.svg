<text class="ts" x="330" y="138" text-anchor="middle" dominant-baseline="central">parallel, parsers only</text></g>
<g class="n-purple"><rect x="440" y="100" width="170" height="56" rx="8"/>
<text class="tm" x="525" y="119" text-anchor="middle" dominant-baseline="central">llm_extract</text>
<text class="ts" x="525" y="138" text-anchor="middle" dominant-baseline="central">only if a parser fails</text></g>
<g class="n-purple"><rect x="50" y="200" width="170" height="56" rx="8"/>
<text class="tm" x="135" y="219" text-anchor="middle" dominant-baseline="central">fx_normalize</text>
<text class="ts" x="135" y="238" text-anchor="middle" dominant-baseline="central">monthly price, VAT flag</text></g>
<g class="n-purple"><rect x="245" y="200" width="170" height="56" rx="8"/>
<text class="tm" x="330" y="219" text-anchor="middle" dominant-baseline="central">validate</text>
<text class="ts" x="330" y="238" text-anchor="middle" dominant-baseline="central">quarantines &gt;30% jumps</text></g>
<g class="n-purple"><rect x="440" y="200" width="170" height="56" rx="8"/>
<text class="tm" x="525" y="219" text-anchor="middle" dominant-baseline="central">adjudicate</text>
<text class="ts" x="525" y="238" text-anchor="middle" dominant-baseline="central">second opinion</text></g>
<g class="n-purple"><rect x="440" y="300" width="170" height="56" rx="8"/>
<text class="tm" x="525" y="319" text-anchor="middle" dominant-baseline="central">persist</text>
<text class="ts" x="525" y="338" text-anchor="middle" dominant-baseline="central">runs/ + latest/</text></g>

