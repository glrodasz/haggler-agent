</g>
<g class="n-purple"><rect x="50" y="100" width="170" height="56" rx="8"/>
<text class="tm" x="135" y="119" text-anchor="middle" dominant-baseline="central">plan_tasks</text>
<text class="ts" x="135" y="138" text-anchor="middle" dominant-baseline="central">one task per source</text></g>
<g class="n-purple"><rect x="245" y="100" width="170" height="56" rx="8"/>
