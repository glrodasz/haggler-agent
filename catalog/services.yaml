  - id: microsoft_365
    name: Microsoft 365
    category: productivity
    eu_geo_class: software_unclear
    homepage: https://www.microsoft.com/microsoft-365
    default_plan: family
    plans:
      - {id: personal, label_es: Personal, label_en: Personal, rank: 0, plausible_monthly_eur: [0.8, 15]}
      - {id: family, label_es: Familia, label_en: Family, rank: 1, plausible_monthly_eur: [1, 20]}
    sources:
      - adapter: ms_displaycatalog
        params:
          # Microsoft Store product ids (bigIds); confirm with the probe workflow.
          big_ids: {personal: CFQ7TTC0K5BF, family: CFQ7TTC0K5DM}
          url: "https://displaycatalog.mp.microsoft.com/v7.0/products?bigIds={big_ids}&market={cc}&languages=en-US"

