    plans:
      # Outside the US the Fan tier is sold as "Premium" ("Suscripción Premium Mensual").
      - {id: fan, label_es: Fan, label_en: Fan, rank: 1, plausible_monthly_eur: [0.5, 20],
         iap_patterns: ['^(?!.*(mega|ultimate|ultimat|definitiv)).*(\bfan\b|premium)']}
      - {id: mega_fan, label_es: Mega Fan, label_en: Mega Fan, rank: 2, plausible_monthly_eur: [0.8, 25],
         iap_patterns: ['\bmega\b']}
      - {id: ultimate_fan, label_es: Ultimate Fan, label_en: Ultimate Fan, rank: 3, plausible_monthly_eur: [1, 30],
         iap_patterns: ['ultimate|ultimat|definitiv']}
    sources:
      - adapter: appstore_iap
        channel: ios_iap
        params:
          app_id: 329913454
          # Legacy and add-on SKUs: Premium+, the annual "Premium Membership", manga bundles,
          # "Anime"/"All-Access" memberships and an item literally named "buy".
          exclude_patterns: ['premium\s*\+', 'premium membership', 'manga', 'anime membership',
                             'all.access', '^\W*buy\W*$', 'game vault', 'coins?\b']

