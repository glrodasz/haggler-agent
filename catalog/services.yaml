# Service catalog. Each source names an adapter in haggler.sources.registry.
# URL templates accept: {cc} (SE), {cc_lower} (se), {apple_prefix} ("se/" or "" for US),
# {disney_locale}, {app_id}, {market} (params.path_overrides[cc] or cc_lower: GB -> uk).
# params.currency_overrides {CC: CUR} pins the currency a source bills a country in when it is
# not the country's own (Netflix bills Romania in EUR).
# plausible_monthly_eur bounds are deliberately wide; they only catch parse errors.
# iap_patterns are case-insensitive regexes over App Store in-app purchase names; exactly one
# plan must match, otherwise the item goes to the LLM for mapping.
# A service's aliases are the names official and bundle pages print for it (bundles.yaml anchors
# name a component by its name or one of these).

services:
  - id: netflix
    name: Netflix
    category: video
    eu_geo_class: audiovisual_excluded
    homepage: https://www.netflix.com
    official_domains: [netflix.com]
    research_urls:
      - https://help.netflix.com/legal/termsofuse
    default_plan: standard
    plans:
      - {id: mobile, label_es: Móvil, label_en: Mobile, rank: 0, plausible_monthly_eur: [0.5, 15],
         aliases: [mobile]}
      - {id: basic_with_ads, label_es: Básico con anuncios, label_en: Basic with ads, rank: 1, ads: true,
         plausible_monthly_eur: [0.8, 15], aliases: [basic with ads]}
      - {id: basic, label_es: Básico, label_en: Basic, rank: 1, plausible_monthly_eur: [1, 20],
         aliases: [basic]}
      - {id: standard_with_ads, label_es: Estándar con anuncios, label_en: Standard with ads, rank: 2,
         ads: true, plausible_monthly_eur: [1, 20], aliases: [standard with ads]}
      - {id: standard, label_es: Estándar, label_en: Standard, rank: 3, plausible_monthly_eur: [1.5, 30],
         aliases: [standard]}
      - {id: premium, label_es: Premium, label_en: Premium, rank: 4, plausible_monthly_eur: [2, 40],
         aliases: [premium]}
    sources:
      - adapter: netflix_help
        params:
          url: "https://help.netflix.com/en/node/24926/{cc_lower}"
          currency_overrides: {RO: EUR}
      - adapter: tompec_netflix
        kind: secondary
        params:
          url: https://raw.githubusercontent.com/tompec/netflix-prices/main/data/latest.json
          currency_overrides: {RO: EUR}
          license: CC BY 4.0
          attribution: Netflix prices dataset by Thomas Pecserke (thomas.io), github.com/tompec/netflix-prices

  - id: youtube_premium
    name: YouTube Premium
    category: video
    eu_geo_class: audiovisual_excluded
    homepage: https://www.youtube.com/premium
    official_domains: [youtube.com, google.com]
    research_urls:
      - https://support.google.com/youtube/answer/6307365
    default_plan: individual
    notes_es: >-
      La web oficial muestra el precio según la IP del visitante; en v1 se usa el listado de compras
      in-app del App Store, que suele ser más caro que la web.
    notes_en: >-
      The official site shows the price based on the visitor's IP; v1 uses the App Store in-app
      purchase list, which is usually more expensive than the website.
    notes_pt: >-
      O site oficial mostra o preço conforme o IP do visitante; na v1 usa-se a lista de compras
      in-app da App Store, que costuma ser mais cara que o site.
    plans:
      - {id: individual, label_es: Individual, label_en: Individual, rank: 1, plausible_monthly_eur: [0.8, 30],
         iap_patterns: ['^(?!.*(fam[ií]l|\baile\b|rodzin|csal[aá]d|rodin|keluarga|gia đình|perhe|student|studenc|estudiant|estudant|universit|studierend|[ée]tudiant|öğrenci|studer|opiskelija|di[aá]k|pelajar|mahasiswa|sinh viên|\blite\b|\bduo\b|music)).*premium']}
      - {id: duo, label_es: Duo, label_en: Duo, rank: 2, plausible_monthly_eur: [1, 35],
         iap_patterns: ['\bduo\b']}
      - {id: family, label_es: Familiar, label_en: Family, rank: 3, plausible_monthly_eur: [1.2, 45],
         iap_patterns: ['fam[ií]l|\baile\b|rodzin|csal[aá]d|rodin|keluarga|gia đình|perhe']}
      - {id: student, label_es: Estudiantes, label_en: Student, rank: 0, plausible_monthly_eur: [0.4, 20],
         iap_patterns: ['student|studenc|estudiant|estudant|universit|studierend|[ée]tudiant|öğrenci|studer|opiskelija|di[aá]k|pelajar|mahasiswa|sinh viên']}
      - {id: lite, label_es: Lite, label_en: Lite, rank: 0, plausible_monthly_eur: [0.4, 15],
         iap_patterns: ['\blite\b']}
    sources:
      - adapter: appstore_iap
        channel: ios_iap
        params: {app_id: 544007664, exclude_patterns: ['music']}

  - id: disney_plus
    name: Disney+
    category: video
    eu_geo_class: audiovisual_excluded
    homepage: https://www.disneyplus.com
    official_domains: [disneyplus.com, disneytermsofuse.com]
    default_plan: standard
    notes_es: >-
      Los precios salen del listado de compras in-app del App Store (app 1446075923), no de la
      web: www.disneyplus.com/robots.txt prohíbe el acceso a todos los agentes salvo buscadores
      y bots de IA con nombre propio ("User-agent: *" / "Disallow: /"). Respetamos robots.txt y
      nunca falsificamos el user agent, así que la fuente web (adapter disney_web) queda fuera
      del catálogo; su código y sus tests se conservan por si Disney cambia su robots.txt.
    notes_en: >-
      Prices come from the App Store in-app purchase list (app 1446075923), not the website:
      www.disneyplus.com/robots.txt forbids access to every agent except search engines and named AI
      bots ("User-agent: *" / "Disallow: /"). We respect robots.txt and never fake the user agent,
      so the web source (adapter disney_web) is left out of the catalog; its code and tests are kept
      in case Disney changes its robots.txt.
    notes_pt: >-
      Os preços vêm da lista de compras in-app da App Store (app 1446075923), não do site:
      www.disneyplus.com/robots.txt proíbe o acesso de todos os agentes, exceto buscadores e bots de
      IA com nome próprio ("User-agent: *" / "Disallow: /"). Respeitamos o robots.txt e nunca
      falsificamos o user agent, então a fonte web (adapter disney_web) fica fora do catálogo; seu
      código e seus testes são mantidos caso a Disney mude o robots.txt.
    plans:
      - {id: standard_with_ads, label_es: Estándar con anuncios, label_en: Standard with ads, rank: 1, ads: true,
         plausible_monthly_eur: [0.8, 20],
         aliases: [standard with ads, basic, med reklam, con anuncios, with adverts, med reklame, med reklamer,
                   mainoksilla, mit werbung, z reklamami, s reklamami, s reklamou, reklámokkal, hirdetésekkel,
                   cu reclame, met reclame, met advertenties, com anúncios, com anuncios, con publicidad,
                   su reklamomis, ar reklāmām, reklaamidega, standart reklamlı, avec pub, avec publicités],
         iap_patterns: ['with ads|with adverts|\bads\b|rekla+m|rekl[aáā]m|\bpub\b|werbung|an[uú]ncio|publicid|publicit|pubblicit|mainok|reclam|advertenties|hirdet|iklan|qu[aả]ng c[aá]o|\bb[aá]sic']}
      - {id: standard, label_es: Estándar, label_en: Standard, rank: 2, plausible_monthly_eur: [1.2, 25],
         aliases: [standard, estándar, standaard, standart, padrão, estandar],
         iap_patterns: ['^(?!.*(\bads\b|advert|rekla+m|rekl[aáā]m|\bpub\b|werbung|an[uú]ncio|publicid|publicit|pubblicit|mainok|reclam|hirdet|iklan|qu[aả]ng c[aá]o|\bb[aá]sic)).*(standard|est[aá]ndar|padr[aã]o|standaard|standart)']}
      - {id: premium, label_es: Premium, label_en: Premium, rank: 3, plausible_monthly_eur: [1.5, 30],
         aliases: [premium], iap_patterns: ['premium']}
    sources:
      - adapter: appstore_iap
        channel: ios_iap
        params:
          app_id: 1446075923
          # Bundles and add-ons sold in the same app (Disney+, Hulu, ESPN+, Max, Star+ ...).
          exclude_patterns: ['hulu', 'espn', 'bundle', 'combo', '\bduo\b', '\btrio\b', 'star\+', '\bmax\b', 'paquete', 'pacote', 'paket']
        # Disney+ is not sold there (other apps such as JioHotstar).
        exclude: [IN, ID, PK, NG, VN]

