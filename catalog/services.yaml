  - id: paramount_plus
    name: Paramount+
    category: video
    eu_geo_class: audiovisual_excluded
    homepage: https://www.paramountplus.com
    official_domains: [paramountplus.com, paramount.com]
    default_plan: standard
    notes_es: >-
      Los precios salen del listado de compras in-app del App Store. En EE. UU. el plan sin
      anuncios se llama Premium y el más barato Essential (con anuncios); en otros países suele
      haber un único plan, que aquí cuenta como Estándar.
    notes_en: >-
      Prices come from the App Store in-app purchase list. In the US the ad-free plan is called
      Premium and the cheapest one Essential (with ads); other countries usually have a single plan,
      counted here as Standard.
    notes_pt: >-
      Os preços vêm da lista de compras in-app da App Store. Nos EUA o plano sem anúncios se chama
      Premium e o mais barato Essential (com anúncios); em outros países costuma haver um único
      plano, que aqui conta como Padrão.
    plans:
      - {id: essential, label_es: Essential (con anuncios), label_en: Essential (with ads), rank: 0, ads: true,
         plausible_monthly_eur: [0.5, 20],
         iap_patterns: ['essential|b[aá]sic|with ads|con anuncios|com an[uú]ncios|mit werbung|med reklam']}
      # Explicit "Standard", or a market's single plan named just "Paramount+" (+ a period word).
      - {id: standard, label_es: Estándar, label_en: Standard, rank: 1, plausible_monthly_eur: [0.5, 25],
         iap_patterns: ['^(?!.*(essential|b[aá]sic|\bads\b|anunc|an[uú]nc|werbung|reklam|premium|showtime)).*(standard|est[aá]ndar|padr[aã]o|^\W*paramount\W*(\b(plus|monthly|annual|yearly|mensual|mensal|anual)\b\W*)*$)']}
      - {id: premium, label_es: Premium, label_en: Premium, rank: 2, plausible_monthly_eur: [1, 30],
         iap_patterns: ['premium|showtime']}
    sources:
      # The US app (530168168) is not sold elsewhere; every other storefront has the
      # international app (1340650234).
      - adapter: appstore_iap
        channel: ios_iap
        # "Limited Commercials" is a US-only middle tier with ads; Essential stays the ad tier.
        params: {app_id: 530168168, exclude_patterns: ['bundle', 'combo', '\bdeal\b', 'limited commercials']}
        countries: [US]
      - adapter: appstore_iap
        channel: ios_iap
        params: {app_id: 1340650234, exclude_patterns: ['bundle', 'combo', '\bdeal\b']}
        exclude: [US]

  - id: crunchyroll
    name: Crunchyroll
    category: video
    eu_geo_class: audiovisual_excluded
