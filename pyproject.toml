[project]
name = "haggler"
version = "0.1.0"
description = "Daily per-country subscription price collector built with Google ADK"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "google-adk==2.11.0",
  "google-cloud-storage>=2.18",
  "httpx>=0.27",
  "pydantic>=2.11",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "selectolax>=0.3.21",
  "babel>=2.16",
]

[project.scripts]
haggler = "haggler.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haggler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore::DeprecationWarning:google.*",
  "ignore:.*EXPERIMENTAL.*:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
